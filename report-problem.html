<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Problem | IT Help Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">IT Help Desk</a>
      <nav class="nav">
        <a href="user-dashboard.html">Dashboard</a>
        <a href="report-problem.html" class="active">Report Problem</a>
        <a href="tickets.html">My Tickets</a>
        <a href="login.html" class="logout">Logout</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container page narrow">
      <div class="page-head">
        <div>
          <a href="user-dashboard.html" class="back">&larr; Back to Dashboard</a>
          <h1>Report an IT Problem</h1>
          <p class="muted">Please provide details so our technical team can diagnose and resolve your issue quickly.</p>
        </div>
      </div>
      <div class="card">
        <form action="user-dashboard.html" method="get" class="form">
          <div class="field">
            <label for="t">Problem Summary / Title</label>
            <input id="t" type="text" placeholder="e.g. Workstation PC will not boot after power outage" required>
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="c">Category</label>
              <select id="c" required>
                <option value="">Select Category...</option>
                <option>Hardware</option>
                <option>Software</option>
                <option>Network</option>
                <option>Printer</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="pr">Priority Level</label>
              <select id="pr" required>
                <option value="Low">Low - Minor inconvenience</option>
                <option value="Medium" selected>Medium - Work impaired but workaround available</option>
                <option value="High">High - Core work blocked</option>
                <option value="Critical">Critical - System/Lab wide outage</option>
              </select>
            </div>
            <div class="field">
              <label for="d">Device Type</label>
              <select id="d" required>
                <option>Laptop</option>
                <option>Desktop Workstation</option>
                <option>Network Printer</option>
                <option>Lab Projector</option>
                <option>Access Point / Switch</option>
                <option>Other Peripheral</option>
              </select>
            </div>
            <div class="field">
              <label for="a">Asset Tag / Serial Number</label>
              <input id="a" type="text" placeholder="e.g. LT-0423 or PR-0056">
            </div>
          </div>
          <div class="field">
            <label for="ds">Detailed Description</label>
            <textarea id="ds" rows="6"
              placeholder="Describe what happened, any error messages shown on screen, and steps to reproduce..."
              required></textarea>
          </div>
          <div class="form-actions">
            <a href="user-dashboard.html" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Submit Ticket</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>

</html>
