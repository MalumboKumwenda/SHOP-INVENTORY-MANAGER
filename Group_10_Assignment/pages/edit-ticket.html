<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Ticket | IT Help Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">IT Help Desk</a>
      <nav class="nav">
        <a href="user-dashboard.html">Dashboard</a>
        <a href="report-problem.html">Report Problem</a>
        <a href="tickets.html">My Tickets</a>
        <a href="login.html" class="logout">Logout</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container page narrow">
      <div class="page-head">
        <div>
          <a href="user-dashboard.html" class="back">&larr; Back to My Tickets</a>
          <h1>Edit Ticket HD-1001</h1>
          <p class="muted">You may edit ticket details while status is Pending.</p>
        </div>
        <span class="badge badge-pending badge-lg">Pending Review</span>
      </div>
      <div class="card">
        <form action="user-dashboard.html" method="get" class="form">
          <div class="field">
            <label for="t">Problem Summary / Title</label>
            <input id="t" type="text" value="Laptop won't power on" required>
          </div>
          <div class="grid-2">
            <div class="field">
              <label for="c">Category</label>
              <select id="c" required>
                <option selected>Hardware</option>
                <option>Software</option>
                <option>Network</option>
                <option>Printer</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="pr">Priority Level</label>
              <select id="pr" required>
                <option>Low</option>
                <option>Medium</option>
                <option selected>High</option>
                <option>Critical</option>
              </select>
            </div>
            <div class="field">
              <label for="d">Device Type</label>
              <select id="d" required>
                <option selected>Laptop</option>
                <option>Desktop Workstation</option>
                <option>Network Printer</option>
                <option>Lab Projector</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="a">Asset Tag</label>
              <input id="a" type="text" value="LT-0423">
            </div>
          </div>
          <div class="field">
            <label for="ds">Detailed Description</label>
            <textarea id="ds" rows="6" required>My laptop does not turn on even after charging overnight. The charging light does not illuminate and the power button produces no response.</textarea>
          </div>
          <div class="form-actions">
            <a href="user-dashboard.html" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
